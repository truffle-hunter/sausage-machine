    <title>Sausage Machine</title>
    <style>
      :root {
        --paper: oklch(0.982 0.006 75);
        --surface: #fff;
        --ink: oklch(0.24 0.025 260);
        --ink-2: oklch(0.45 0.02 260);
        --line: oklch(0.9 0.008 75);
        --copper: oklch(0.52 0.125 47);
        --copper-ink: #fff;
        --red: oklch(0.52 0.18 27);
        --focus: 0 0 0 3px oklch(0.62 0.14 47 / 0.45);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: oklch(0.18 0.012 260);
          --surface: oklch(0.225 0.014 260);
          --ink: oklch(0.95 0.006 75);
          --ink-2: oklch(0.78 0.01 75);
          --line: oklch(0.33 0.012 260);
          --copper: oklch(0.72 0.12 55);
          --copper-ink: oklch(0.2 0.03 50);
          --red: oklch(0.72 0.15 25);
        }
      }
      html {
        font-size: 17px;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 400 1rem/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #gate {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 27.5px 17px;
        box-sizing: border-box;
      }
      #gate form {
        width: 100%;
        max-width: 360px;
        display: flex;
        flex-direction: column;
        gap: 17px;
        text-align: center;
      }
      #gate img {
        width: 72px;
        height: 72px;
        margin: 0 auto;
        border-radius: 17px;
      }
      #gate h1 {
        margin: 0;
        font-size: 1.618rem;
        letter-spacing: -0.02em;
      }
      #gate p {
        margin: 0;
        color: var(--ink-2);
      }
      #gate label {
        text-align: left;
        font-size: 0.786rem;
        font-weight: 600;
        color: var(--ink-2);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #gate input[type='password'] {
        font: inherit;
        font-size: 1rem;
        min-height: 52px;
        padding: 0 14px;
        border-radius: 13px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
      }
      #gate input:focus {
        outline: none;
        border-color: var(--copper);
        box-shadow: var(--focus);
      }
      #gate .remember {
        flex-direction: row;
        align-items: center;
        gap: 10px;
        font-size: 1rem;
        font-weight: 400;
        color: var(--ink);
        min-height: 44px;
      }
      #gate .remember input {
        width: 22px;
        height: 22px;
        accent-color: var(--copper);
      }
      #gate button {
        font: inherit;
        font-weight: 600;
        min-height: 56px;
        border: 0;
        border-radius: 21px;
        background: var(--copper);
        color: var(--copper-ink);
        cursor: pointer;
      }
      #gate button:disabled {
        opacity: 0.6;
      }
      #gate .err {
        color: var(--red);
        font-weight: 600;
        min-height: 1.45em;
      }
    </style>
  </head>
  <body>
    <div id="gate" hidden>
      <form id="f" autocomplete="on">
        <img src="./icons/icon-192.png" alt="" />
        <h1>Sausage Machine</h1>
        <p data-t="intro">Enter the password to open your invoices.</p>
        <input type="text" name="username" value="sausage-machine" autocomplete="username" hidden />
        <label><span data-t="pw">Password</span><input id="pw" type="password" name="password" autocomplete="current-password" required autofocus /></label>
        <label class="remember"><input id="remember" type="checkbox" checked /> <span data-t="remember">Remember on this phone</span></label>
        <button id="go" type="submit">Unlock</button>
        <div class="err" id="err" role="alert"></div>
      </form>
    </div>

    <script>
      (function () {
        'use strict';
        var KEY = 'sm-gate-key';
        var P = JSON.parse(document.getElementById('payload').textContent);
        var gate = document.getElementById('gate');
        var err = document.getElementById('err');
        var btn = document.getElementById('go');

        // Same language choice as the app (src/i18n.ts): saved on this phone, else the phone's language.
        var WORDS = {
          en: {
            intro: 'Enter the password to open your invoices.',
            pw: 'Password',
            remember: 'Remember on this phone',
            unlock: 'Unlock',
            unlocking: 'Unlocking…',
            wrong: 'Wrong password. Try again.',
            old: 'This phone’s browser is too old. Update iOS (16.4 or newer) or Chrome, then reload.'
          },
          ro: {
            intro: 'Introdu parola ca să-ți deschizi facturile.',
            pw: 'Parolă',
            remember: 'Ține minte pe acest telefon',
            unlock: 'Deblochează',
            unlocking: 'Se deblochează…',
            wrong: 'Parolă greșită. Încearcă din nou.',
            old: 'Browserul acestui telefon este prea vechi. Actualizează iOS (16.4 sau mai nou) sau Chrome, apoi reîncarcă.'
          }
        };
        var LANG = (function () {
          try {
            var l = localStorage.getItem('sm-lang');
            if (l === 'en' || l === 'ro') return l;
          } catch (e) {}
          return /^ro\b/i.test(navigator.language || '') ? 'ro' : 'en';
        })();
        function T(k) {
          return WORDS[LANG][k];
        }
        document.documentElement.lang = LANG;
        Array.prototype.forEach.call(document.querySelectorAll('[data-t]'), function (el) {
          el.textContent = T(el.getAttribute('data-t'));
        });

        function b64d(s) {
          var bin = atob(s);
          var out = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
          return out;
        }
        function b64e(buf) {
          var bytes = new Uint8Array(buf);
          var bin = '';
          for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          return btoa(bin);
        }
        function store(get, val) {
          try {
            if (get) return localStorage.getItem(KEY);
            if (val === null) localStorage.removeItem(KEY);
            else localStorage.setItem(KEY, val);
          } catch (e) {
            return null;
          }
        }
        function supported() {
          return !!(window.crypto && crypto.subtle && window.DecompressionStream);
        }

        async function derive(pw) {
          var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
          return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64d(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
        }
        async function open(key) {
          var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64d(P.iv) }, key, b64d(P.ct));
          var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
          return JSON.parse(await new Response(stream).text());
        }
        function boot(app) {
          gate.remove();
          var st = document.createElement('style');
          st.textContent = app.css;
          document.head.appendChild(st);
          var root = document.createElement('div');
          root.id = 'app';
          document.body.appendChild(root);
          var s = document.createElement('script');
          s.type = 'module';
          s.textContent = app.js;
          document.body.appendChild(s);
        }
        function show(message) {
          gate.hidden = false;
          err.textContent = message || '';
          btn.disabled = false;
          btn.textContent = T('unlock');
        }

        if ('serviceWorker' in navigator && location.protocol === 'https:') {
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(function () {});
        }

        if (!supported()) {
          show(T('old'));
          btn.disabled = true;
          return;
        }

        document.getElementById('f').addEventListener('submit', async function (e) {
          e.preventDefault();
          var pw = document.getElementById('pw').value;
          if (!pw) return;
          btn.disabled = true;
          btn.textContent = T('unlocking');
          err.textContent = '';
          try {
            var key = await derive(pw);
            var app = await open(key);
            if (document.getElementById('remember').checked) {
              store(false, JSON.stringify({ salt: P.salt, k: b64e(await crypto.subtle.exportKey('raw', key)) }));
            }
            boot(app);
          } catch (e2) {
            show(T('wrong'));
            document.getElementById('pw').select();
          }
        });

        // Remembered phone: unlock without typing. A changed password or salt just shows the form again.
        (async function () {
          var saved = store(true);
          if (saved) {
            try {
              var s = JSON.parse(saved);
              if (s.salt === P.salt) {
                var key = await crypto.subtle.importKey('raw', b64d(s.k), { name: 'AES-GCM' }, false, ['decrypt']);
                boot(await open(key));
                return;
              }
            } catch (e3) {
              store(false, null);
            }
          }
          show('');
        })();
      })();
    </script>
